name: Release artifacts
on:
  push:
    # Version tags only: a junk v-tag otherwise burns check+live before the
    # packaging script rejects it. The semver validation in package.sh stays
    # as the second wall.
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/check.yml
  live:
    uses: ./.github/workflows/live.yml
  artifacts:
    needs: [check, live]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Package tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/package.sh "$RELEASE_TAG"
      - name: Smoke-check archives
        run: make package-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: abx-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
