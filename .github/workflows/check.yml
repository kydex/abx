name: Check
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check commit subjects
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$PR_BASE
            head=$PR_HEAD
          else
            base=$PUSH_BEFORE
            head=$SHA
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-parse "$head^" 2>/dev/null || true)
          fi
          if [ -n "$base" ]; then
            range="$base..$head"
          else
            range=$head
          fi
          git rev-list --count "$range" >/dev/null
          status=0
          while IFS=' ' read -r hash subject; do
            if [ "${#subject}" -gt 72 ]; then
              printf 'error: %s subject is %s characters (limit 72): %s\n' "$hash" "${#subject}" "$subject" >&2
              status=1
            fi
          done < <(git log --format='%h %s' "$range")
          exit "$status"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install check tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          tools="$RUNNER_TEMP/abx-check-tools"
          mkdir -p "$tools"
          GOBIN="$tools" go install golang.org/x/vuln/cmd/govulncheck@latest
          GOBIN="$tools" go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$tools" >> "$GITHUB_PATH"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-only: true
      - run: make check
