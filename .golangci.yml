version: "2"
linters:
  # `standard` is errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  settings:
    staticcheck:
      # QF1001 (De Morgan) would rewrite negated allow-lists in validators
      # into conjunctions of negations. The current form reads as "reject
      # anything outside this set" and is easier to audit; keep it.
      checks: ["all", "-QF1001"]
  enable:
    - gosec
  exclusions:
    rules:
      # Tests intentionally do "unsafe" things: odd chmod values, exec of
      # helper scripts and test binaries, reads of fixture paths, unchecked
      # closes of temporary files.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
formatters:
  enable:
    - gofumpt
    - goimports
run:
  timeout: 5m
